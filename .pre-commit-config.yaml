# Two stages, by design:
#
# pre-commit -- fast, auto-fixing checks only. Committing must stay cheap.
# pre-push   -- the whole-repo gates that most often break CI (pyright, clippy). These run
#               once per push instead of once per commit, so they catch a red build before
#               it reaches a PR without taxing the edit/commit loop.
#
# The full pytest suite and cargo-test are deliberately in NEITHER: they rebuild the Rust
# extension, and CI shards them across runners far faster than a local serial run.
default_install_hook_types: [pre-commit, pre-push]
repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    # Keep in sync with the ruff pin resolved in uv.lock, which CI reads via `version-file`.
    rev: v0.15.12
    hooks:
      # No `files:` filter: CI runs `ruff check .` over the whole tree, so scoping these to
      # src/ and tests/ meant new top-level directories could only ever fail in CI. Ruff's own
      # config already decides what is in scope.
      - id: ruff-check
        args: [--fix]
      - id: ruff-format
  # markdownlint-cli2 (Markdown structure rules + custom unicode rule) and html-validate
  # (HTML inside markdown, ```html fences only) — the whole-repo gates re-run both with the
  # same pins in the `markdown-lint` job in .github/workflows/ci.yml; keep the pins in sync.
  - repo: https://github.com/DavidAnson/markdownlint-cli2
    rev: v0.23.3
    hooks:
      - id: markdownlint-cli2
        args: [--fix]
        # File scope comes from the globs/ignores in .markdownlint-cli2.jsonc (same policy as
        # ruff above: config decides, so new top-level trees cannot escape the gate).
        pass_filenames: false
  - repo: local
    hooks:
      - id: cargo-fmt
        name: cargo-fmt
        entry: cargo fmt --check --manifest-path rust/Cargo.toml
        language: system
        types: [rust]
        files: ^rust/
        pass_filenames: false
      # Catches a pyproject.toml edit that was never relocked -- otherwise the failure
      # surfaces much later, as a confusing `uv sync --frozen` error in CI.
      - id: uv-lock-check
        name: uv-lock-check
        entry: uv lock --check
        language: system
        files: ^(pyproject\.toml|uv\.lock)$
        pass_filenames: false
      # No official pre-commit mirror exists for html-validate, hence a local node hook.
      # The third-party html-validate-markdown transformer lints ONLY ```html code fences:
      # html-validate's built-in markdown transformer does not escape "<" inside inline code
      # spans, so prose like `(?<=...)` or `<name>_<version>` (this repo's placeholder
      # convention) is parsed as start tags and fails with unsuppressible parse errors.
      # Fence-scoped validation has zero false positives and still gates real HTML blocks.
      - id: html-validate
        name: html-validate
        entry: html-validate "**/*.md"
        language: node
        additional_dependencies:
          # Keep in sync with the npx pins in .github/workflows/ci.yml (markdown-lint job).
          - html-validate@11.16.4
          - html-validate-markdown@6.0.0
        pass_filenames: false
      - id: pyright
        name: pyright
        entry: uv run pyright
        language: system
        types_or: [python, pyi]
        pass_filenames: false
        stages: [pre-push]
      - id: cargo-clippy
        name: cargo-clippy
        entry: cargo clippy --manifest-path rust/Cargo.toml --all-targets -- -D warnings
        language: system
        types: [rust]
        files: ^rust/
        pass_filenames: false
        stages: [pre-push]
