name: Deploy MkDocs
on:
  workflow_dispatch:
  push:
    branches:
      - main
permissions:
  contents: write
jobs:
  deploy-docs:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.3
        with:
          python-version: "3.13"
          enable-cache: true
          prune-cache: true
          cache-suffix: docs
      # No mkdocs plugin imports tablassert (the API pages are hand-written markdown), so the
      # site builds without installing the project -- which skips the whole maturin/Rust build.
      - name: Sync docs dependencies
        run: uv sync --frozen --no-default-groups --group docs --no-install-project
      - name: Build documentation
        run: uv run --no-sync mkdocs build --strict
      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./site
          user_name: "github-actions[bot]"
          user_email: "github-actions[bot]@users.noreply.github.com"
