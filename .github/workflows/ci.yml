name: CI

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Both syncing jobs install this EXACT set, so they share one warm uv cache instead of
  # racing to save mutually-useless ones. See the `ci` group in pyproject.toml.
  SYNC_ARGS: --no-default-groups --group ci --extra cli --extra qc --extra log

jobs:
  python-lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      # Ruff runs standalone: `ruff check` measures 0s, so a full `uv sync` in front of it was
      # ~40s of pure overhead. `version-file` reads the resolved pin (0.15.12) out of uv.lock,
      # which is the same version .pre-commit-config.yaml pins, so local and CI cannot drift.
      - name: Ruff lint
        uses: astral-sh/ruff-action@v4.1.0
        with:
          version-file: uv.lock
          args: check --output-format=github
      - name: Ruff format check
        uses: astral-sh/ruff-action@v4.1.0
        with:
          version-file: uv.lock
          args: format --check

  # Markdown gates, standalone like ruff above (node is preinstalled on ubuntu runners, so no
  # setup step). Same two checks the pre-commit hooks run; pins must stay in sync with
  # .pre-commit-config.yaml (markdownlint-cli2 rev and the html-validate additional_dependencies).
  # File scope: markdownlint-cli2 reads its globs/ignores from .markdownlint-cli2.jsonc;
  # html-validate validates ONLY ```html fences inside markdown (see the pre-commit comment for
  # why) via the transform in .htmlvalidate.json.
  markdown-lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: markdownlint-cli2
        run: npx -y markdownlint-cli2@0.23.3
      - name: html-validate (```html fences in markdown)
        run: npx -y -p html-validate@11.16.4 -p html-validate-markdown@6.0.0 html-validate "**/*.md"

  python-type:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.0
        with:
          python-version: "3.13"
          enable-cache: true
          # `prune-cache` is NOT on by default; without it the saved cache carries both the
          # zipped and unzipped copy of every wheel, which matters a lot with the qc extra.
          prune-cache: true
          cache-suffix: ci-cli-qc
      - name: Sync dependencies
        run: uv sync --frozen ${{ env.SYNC_ARGS }}
      - name: Pyright
        run: uv run pyright

  # Deliberately NOT sharded across a matrix. Measured on this repo: ~21s of every pytest
  # run is fixed overhead (interpreter start, imports, xdist workers, coverage init) against
  # only ~15s of actual test execution, so a 4-way split saved ~12s of test time while the
  # slowest-of-four sync straggler plus a coverage-combine job cost ~20s more than it saved.
  python-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.0
        with:
          python-version: "3.13"
          enable-cache: true
          prune-cache: true
          cache-suffix: ci-cli-qc
      - name: Sync dependencies
        run: uv sync --frozen ${{ env.SYNC_ARGS }}
      - name: Build Rust extension
        run: uv run maturin develop --manifest-path rust/Cargo.toml
      # `-n auto` comes from the pyproject addopts; coverage is reported inline.
      - name: Run tests
        run: uv run pytest

  rust:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
      - name: Cargo fmt
        run: cargo fmt --check --manifest-path rust/Cargo.toml
      - name: Cargo clippy
        run: cargo clippy --manifest-path rust/Cargo.toml --all-targets -- -D warnings
      - name: Cargo test
        run: cargo test --manifest-path rust/Cargo.toml
