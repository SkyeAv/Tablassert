name: CI

# Runs only when a release is cut (a push to main that changes project.version in
# pyproject.toml, i.e. a `chore(release): X.Y.Z` commit) or on manual dispatch. Pull
# requests and ordinary pushes do not trigger it; contributors run `make check` locally
# and the pre-commit / pre-push hooks cover the fast gates.
on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - pyproject.toml

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # The Python-syncing jobs install this EXACT set, so they share one warm uv cache instead
  # of racing to save mutually-useless ones. See the `ci` group in pyproject.toml.
  SYNC_ARGS: --no-default-groups --group ci --extra cli --extra qc --extra log --extra webui

jobs:
  # Release gate: a pyproject.toml push that does not change project.version (a dependency
  # edit, say) skips every job. workflow_dispatch always runs the full suite. Same detection
  # action the tag and PyPI workflows use, so all three agree on what counts as a release.
  release-gate:
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.version.outputs.changed }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Detect release
        id: version
        uses: ./.github/actions/detect-pyproject-version-change
        with:
          before-sha: ${{ github.event.before }}
          event-name: ${{ github.event_name }}

  # Formatting gate: the same fixers as the local pre-commit hooks, in check mode. Nothing
  # is pushed back; any violation fails the job with the offending diff.
  format:
    runs-on: ubuntu-latest
    needs: [release-gate]
    if: needs.release-gate.outputs.run == 'true'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      # Ruff runs standalone; `version-file` reads the resolved pin out of uv.lock -- the
      # same rev .pre-commit-config.yaml pins -- so local and CI cannot drift.
      - name: Ruff lint
        uses: astral-sh/ruff-action@v4.1.0
        with:
          version-file: uv.lock
          args: check --output-format=github
      - name: Ruff format
        uses: astral-sh/ruff-action@v4.1.0
        with:
          version-file: uv.lock
          args: format --check --diff
      - name: markdownlint
        run: npx -y markdownlint-cli2@0.23.3
      - name: Cargo fmt
        run: cargo fmt --check --manifest-path rust/Cargo.toml

  # Markdown gate, standalone (node is preinstalled on ubuntu runners, so no setup step).
  # The markdownlint-cli2 half of the pre-commit parity runs in the format job. The
  # html-validate pins must stay in sync with the .pre-commit-config.yaml
  # additional_dependencies.
  # File scope: html-validate validates ONLY ```html fences inside markdown (see the
  # pre-commit comment for why) via the transform in .htmlvalidate.json.
  markdown-lint:
    runs-on: ubuntu-latest
    needs: [release-gate]
    if: needs.release-gate.outputs.run == 'true'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: html-validate (```html fences in markdown)
        run: npx -y -p html-validate@11.16.4 -p html-validate-markdown@6.0.0 html-validate "**/*.md"

  # Docs site gate: the same build docs.yml deploys from main, minus the Pages publish.
  # mkdocs builds without installing the project (the API pages are hand-written markdown),
  # so no Rust/maturin build is needed here.
  docs:
    runs-on: ubuntu-latest
    needs: [release-gate]
    if: needs.release-gate.outputs.run == 'true'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.3
        with:
          python-version: "3.13"
          enable-cache: true
          prune-cache: true
          cache-suffix: docs
      - name: Sync docs dependencies
        run: uv sync --frozen --no-default-groups --group docs --no-install-project
      - name: Build documentation
        run: uv run --no-sync mkdocs build --strict

  python-type:
    runs-on: ubuntu-latest
    needs: [release-gate]
    if: needs.release-gate.outputs.run == 'true'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.3
        with:
          python-version: "3.13"
          enable-cache: true
          # `prune-cache` is NOT on by default; without it the saved cache carries both the
          # zipped and unzipped copy of every wheel, which matters a lot with the qc extra.
          prune-cache: true
          cache-suffix: ci-cli-qc
      - name: Sync dependencies
        run: uv sync --frozen ${{ env.SYNC_ARGS }}
      - name: Pyright
        run: uv run pyright
      # Dead-code gate: same vulture pin and [tool.vulture] config as the pre-push hook.
      - name: Vulture (dead code)
        run: uv run vulture
      # Dependency hygiene: same deptry pin and [tool.deptry] config as the pre-push hook.
      - name: Deptry (dependency hygiene)
        run: uv run deptry .

  # Deliberately NOT sharded across a matrix. Measured on this repo: ~21s of every pytest
  # run is fixed overhead (interpreter start, imports, xdist workers, coverage init) against
  # only ~15s of actual test execution, so a 4-way split saved ~12s of test time while the
  # slowest-of-four sync straggler plus a coverage-combine job cost ~20s more than it saved.
  # The full suite also covers the docs-consistency tests.
  python-test:
    runs-on: ubuntu-latest
    needs: [release-gate]
    if: needs.release-gate.outputs.run == 'true'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.3
        with:
          python-version: "3.13"
          enable-cache: true
          prune-cache: true
          cache-suffix: ci-cli-qc
      - name: Sync dependencies
        run: uv sync --frozen ${{ env.SYNC_ARGS }}
      - name: Build Rust extension
        run: uv run maturin develop --manifest-path rust/Cargo.toml
      # `-n auto` comes from the pyproject addopts; coverage is reported inline.
      - name: Run tests
        run: uv run pytest

  rust:
    runs-on: ubuntu-latest
    needs: [release-gate]
    if: needs.release-gate.outputs.run == 'true'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
      # cargo fmt is enforced by the format job.
      - name: Cargo clippy
        run: cargo clippy --manifest-path rust/Cargo.toml --all-targets -- -D warnings
      # Unused-dependency gate; same cargo-machete pin as the pre-push hook in
      # .pre-commit-config.yaml. Options must precede paths; the fresh checkout has no
      # target/ dirs, so no --skip-targets is needed.
      - name: Cargo machete (unused dependencies)
        uses: bnjbvr/cargo-machete@v0.10.1
        with:
          args: rust/
      - name: Cargo test
        run: cargo test --manifest-path rust/Cargo.toml
