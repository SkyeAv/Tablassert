name: Deploy to PyPI
on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - pyproject.toml

permissions:
  contents: read

jobs:
  detect-version-change:
    if: github.ref_name == 'main'
    runs-on: ubuntu-latest
    outputs:
      should_publish: ${{ steps.version.outputs.should_publish }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Check pyproject version change
        id: version
        uses: ./.github/actions/detect-pyproject-version-change
        with:
          before-sha: ${{ github.event.before }}
          event-name: ${{ github.event_name }}

  sdist:
    needs: detect-version-change
    if: needs.detect-version-change.outputs.should_publish == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.3
        with:
          # setup-uv v10 defaults `enable-cache` to "auto", which is ON for this workflow's
          # push-to-main / workflow_dispatch triggers (v4 defaulted to false). This job only runs
          # `uv build --sdist` -- it never syncs dependencies, so a cache buys nothing -- and the
          # caching `post` step can fail the job after a good build, which would skip `publish`
          # and leave a tag with nothing on PyPI.
          enable-cache: false
      - name: Build sdist
        run: uv build --sdist
      - name: Upload sdist
        uses: actions/upload-artifact@v7
        with:
          name: sdist
          path: dist/*.tar.gz

  wheels:
    needs: detect-version-change
    if: needs.detect-version-change.outputs.should_publish == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Set up Python interpreters
        uses: actions/setup-python@v7
        with:
          python-version: |
            3.11
            3.12
            3.13
            3.14
      - name: Build wheels
        uses: PyO3/maturin-action@v1
        with:
          command: build
          args: --release --find-interpreter --locked --compatibility pypi --out dist
      - name: Upload wheels
        uses: actions/upload-artifact@v7
        with:
          name: wheels-${{ matrix.os }}
          path: dist/*.whl

  publish:
    needs: [detect-version-change, sdist, wheels]
    if: needs.detect-version-change.outputs.should_publish == 'true'
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          skip-existing: true
