name: tutorial-koza-resolved

reader:
  files:
    - ./tutorial-data-10k.csv
  format: csv
  delimiter: ","

transform:
  code: ./tutorial-transform-resolved.py

writer:
  format: tsv
  node_properties:
    - id
    - name
    - category
  edge_properties:
    - subject
    - predicate
    - object
    - primary_knowledge_source
    - publications
    - p_value
    - sample_size

metadata:
  name: Tutorial tabular source (Koza with hosted resolution)
  description: Same mapping with hosted NameResolution and NodeNormalization.
